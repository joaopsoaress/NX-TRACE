[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-trace"
version = "2.0.0"
description = "REST API Behavioral Analysis Scanner"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "João P.Soares"}
]
keywords = ["security", "scanner", "api", "pentesting"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Security",
]

dependencies = [
    "requests>=2.28.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[project.scripts]
nx-trace = "nx_trace.cli.scanner:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["nx_trace", "nx_trace.cli", "nx_trace.core", "nx_trace.utils"]

[tool.setuptools.package-data]
"nx_trace" = ["data/*.txt"]